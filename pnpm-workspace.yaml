packages:
  - "."

# Keep in sync with package.json#pnpm.overrides (pnpm 9 reads package.json; 10+ reads this file).
minimumReleaseAge: 0

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  "@babel/core": ">=7.29.6"
  "@babel/plugin-transform-modules-systemjs": ">=7.29.4"
  "@isaacs/brace-expansion": ">=5.0.1"
  brace-expansion: "^2.1.4"
  dompurify: ">=3.4.13"
  esbuild: ">=0.25.0"
  fast-uri: ">=3.1.5"
  flatted: ">=3.4.2"
  js-yaml: ">=4.2.0"
  lodash: ">=4.17.24"
  lru-cache: "11.5.1"
  picomatch: ">=4.0.4"
  postcss: ">=8.5.23"
  sharp: ">=0.35.0"
